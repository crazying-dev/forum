components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "forum_session"
    legacyCookie:
      type: "apiKey"
      in: "cookie"
      name: "token"
  schemas:
    Error:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
    MediaAsset:
      type: "object"
      properties:
        id:
          type: "string"
        url:
          type: "string"
        mime:
          type: "string"
        size:
          type: "integer"
        width:
          type: "integer"
        height:
          type: "integer"
        visibility:
          type: "string"
        owner_type:
          type: "string"
    WorldMessage:
      type: "object"
      properties:
        id:
          type: "integer"
        sender_id:
          type: "string"
        sender_name:
          type: "string"
        sender_avatar:
          type: "string"
        content:
          type: "string"
        content_format:
          type: "string"
        parent_id:
          type: "integer"
          nullable: true
        guild_id:
          type: "string"
        guild_name:
          type: "string"
        is_leader:
          type: "boolean"
        is_admin:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
    MessageSummary:
      type: "object"
      properties:
        likes:
          type: "integer"
        comments:
          type: "integer"
        system:
          type: "integer"
        chat:
          type: "integer"
    ChatMessage:
      type: "object"
      properties:
        id:
          type: "integer"
        sender_type:
          type: "string"
          enum:
            - "user"
            - "admin"
        sender_name:
          type: "string"
        sender_avatar:
          type: "string"
        admin_id:
          type: "string"
        content_html:
          type: "string"
        content_format:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
    Changelog:
      type: "object"
      properties:
        id:
          type: "integer"
        version:
          type: "string"
        title:
          type: "string"
        content_html:
          type: "string"
        published_at:
          type: "string"
          format: "date-time"
    DownloadRelease:
      type: "object"
      properties:
        platform:
          type: "string"
        version:
          type: "string"
        channel:
          type: "string"
        date:
          type: "string"
        size:
          type: "integer"
        url:
          type: "string"
        filename:
          type: "string"
        sha256:
          type: "string"
        notes:
          type: "array"
          items:
            type: "string"
        mandatory:
          type: "boolean"
    Announcement:
      type: "object"
      properties:
        enabled:
          type: "boolean"
        text:
          type: "string"
        version:
          type: "integer"
        updated_at:
          type: "string"
