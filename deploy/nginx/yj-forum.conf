# 妖精论坛 ov2 Nginx 反向代理配置（宝塔/裸机通用）
# 放在 /etc/nginx/conf.d/ 或宝塔站点配置中；域名示例 yjlt.top（替换为实际域名）
#
# 生产拓扑（见 deploy/wireguard/ 与 docs/runbook-s3-prod.md）：
#   Host A（本机）：ouo Go :8090、Next.js :3000、SeaweedFS 10.8.0.1:8333
#   Host B（WireGuard 10.8.0.2）：admin Go :8080
# 会馆图片 / 指南正文图片经 WireGuard 反代到 Host B。
#
# ⚠️ 下方 map / proxy_cache_path 必须位于 nginx 的 http{} 级（本文件默认放 conf.d 时成立）。
#    如果粘贴进宝塔站点配置（server{} 内部），请把这两个块单独移到 http 级
#    （例如 /etc/nginx/conf.d/00-ov2-media-cache.conf），否则 nginx -t 会报错。

# 上游媒体响应头 → 是否禁止写入缓存（私有资源不得进共享缓存）
map $upstream_http_x_media_cache $media_header_private {
    default       0;
    "~*private"   1;
    "~*no-store"  1;
}

# 兜底：即使上游忘了发 X-Media-Cache，只要 Cache-Control 含 private/no-store/no-cache 也不缓存
map $upstream_http_cache_control $media_cc_no_cache {
    default                    0;
    "~*(private|no-store|no-cache)" 1;
}

# 缓存键归一化：只把白名单内的 w 值纳入 key，避免 ?任意参数 无限生成缓存条目。
# 后端只接受 480 / 1280，其余 w 会回落原图，因此可安全归一到空。
map $arg_w $media_w_key {
    default  "";
    "480"    "?w=480";
    "1280"   "?w=1280";
}

# 媒体缓存：3g 上限、30 天未访问淘汰、共享内存 100m
# （宿主机根盘仅 39G/21G 可用，不能照搬 20g；缓存与 SeaweedFS 10g 上限之和必须留出系统余量）
# 目录需预先存在且属主为 nginx 运行用户：
#   install -d -o <nginx-user> -g <nginx-user> /var/cache/nginx/ov2-media
proxy_cache_path /var/cache/nginx/ov2-media levels=1:2 keys_zone=media:100m max_size=3g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name yjlt.top www.yjlt.top;

    # 安全头（对齐 legacy vercel.json）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 媒体文件（图片 / 富文本图）→ Go 后端（字节存 SeaweedFS）；本地 nginx 缓存。
    # 私有资源（聊天 / 私密帖）上游会带 X-Media-Cache: private 或 Cache-Control: private，
    # 经上方 map 映射为 proxy_no_cache，不会进入共享缓存。
    location /ov2/api/media/ {
        proxy_pass http://127.0.0.1:8090;
        client_max_body_size 12m;          # POST /ov2/api/media/images 上传
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache media;
        # cache key：$uri + 归一化后的 w（只认 480/1280），其它 query 不参与，避免缓存污染
        proxy_cache_key "$scheme$request_method$host$uri$media_w_key";
        # 只缓存 200：404/502 一律不缓存，避免未登录请求或误路径把正常用户也带成 404
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # 由上方 map 兜底判断私有资源；公开资源固定缓存 7d
        proxy_ignore_headers Cache-Control Expires;
        proxy_no_cache $media_header_private $media_cc_no_cache;
        proxy_hide_header Set-Cookie;

        # 本 location 有 add_header，会覆盖 server 级安全头，故重复一遍
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 新 API（canonical）→ Go 后端
    location /ov2/api/ {
        proxy_pass http://127.0.0.1:8090;
        # 媒体 ≤5MB、头像 ≤10MB、多图/富文本余量
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SSE 长连接：必须直连 Go，关闭缓冲/缓存/gzip，长读超时
    location = /ov2/api/world/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ov2/api/messages/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 旧 API（/api/v1 别名 + 旧 APP /api/* 兼容层）→ Go 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 头像文件 → Go 后端
    location /avatar/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # 历史会馆/指南图片兼容（旧 GridFS 资源仍在管理端）：
    #   /guild-img/guilds/{uuid}/... → admin /api/guilds/{uuid}/...
    #   /guide-img/guides/images/... → admin /api/guides/images/...
    # 新 MD 媒体仍直出 /ov2/api/media/<id>（上面的 location）。
    location /guild-img/ {
        rewrite ^/guild-img/(.*)$ /api/$1 break;
        proxy_pass http://10.8.0.2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /guide-img/ {
        rewrite ^/guide-img/(.*)$ /api/$1 break;
        proxy_pass http://10.8.0.2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 其余 → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    # 旧版 /static/img（旧帖图/默认头像兼容；文件已复制进 web/public/static）
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 默认分享图（社交爬虫高频回源，长缓存）
    location = /og-image.png {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

