# 妖精论坛 ov2 Nginx 反向代理配置（宝塔/裸机通用）
# 放在 /etc/nginx/conf.d/ 或宝塔站点配置中；域名示例 yjlt.top（替换为实际域名）
#
# 会馆图片（logo / 馆长介绍页图片 / 会馆介绍页封面与正文图片）代理所需的管理端（admin）地址：生产需按实际部署地址调整。
# 若希望用 upstream 复用连接，可在 http 级（本文件 server{} 之前）启用并改名下方示例，
# 再将 server 内 location /guild-img/ 的 proxy_pass 换成 http://yj-forum-admin/api/：
# upstream yj-forum-admin { server 127.0.0.1:8080; }   # 按实际部署地址调整
server {
    listen 80;
    server_name yjlt.top www.yjlt.top;

    # 安全头（对齐 legacy vercel.json）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 新 API（canonical）→ Go 后端
    location /ov2/api/ {
        proxy_pass http://127.0.0.1:8090;
        # 媒体 ≤5MB、头像 ≤10MB、多图/富文本余量
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SSE 长连接：必须直连 Go，关闭缓冲/缓存/gzip，长读超时
    location = /ov2/api/world/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /ov2/api/messages/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 旧 API（/api/v1 别名 + 旧 APP /api/* 兼容层）→ Go 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 头像文件 → Go 后端
    location /avatar/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # 会馆图片（logo / 馆长介绍页图片 / 会馆介绍页封面与正文图片）→ 管理端（admin）后端；
    # 前端请求示例：/guild-img/guilds/{id}/logo?v={version}、/guild-img/guilds/{id}/leader-images/{fileId}、/guild-img/guilds/{id}/intro-images/{fileId}
    # 映射规则：/guild-img/<path> → <admin>/api/<path>（如 /api/guilds/{id}/logo、/api/guilds/{id}/leader-images/{fileId}、/api/guilds/{id}/intro-images/{fileId}）
    # 生产需按实际部署地址调整 proxy_pass（upstream 写法见文件顶部注释）
    location /guild-img/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 论坛指南正文图片 → 管理端（admin）后端，与 /guild-img/ 同模式；
    # 映射规则：/guide-img/<path> → <admin>/api/<path>（如 /guide-img/guides/{id}/images/{fileId} → /api/guides/{id}/images/{fileId}）
    # 生产需按实际部署地址调整 proxy_pass（upstream 写法见文件顶部注释）
    location /guide-img/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    # 旧版 /static/img（旧帖图/默认头像兼容；文件已复制进 web/public/static）
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 默认分享图（社交爬虫高频回源，长缓存）
    location = /og-image.png {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

