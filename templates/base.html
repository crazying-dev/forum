<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="妖精论坛 - 罗小黑战记社区">
<meta name="theme-color" content="#6A8C89">
<title>{% block title %}妖精论坛{% endblock %}</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="妖精论坛">
<link rel="apple-touch-icon" href="/static/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/static/css/main.css?v={{ static_version }}">
<script src="/static/js/marked.min.js"></script>
<script>
// 防闪屏：按 localStorage 或时间判断主题
(function () {
  var t = null;
  try { t = localStorage.getItem('forum-theme'); } catch (e) {}
  if (t === 'night' || (!t && new Date().getHours() >= 18) || (!t && new Date().getHours() < 6)) {
    document.documentElement.classList.add('night-mode');
  }
})();
</script>
</head>
<body{% block body_attrs %}{% endblock %}>

<header class="header">
  <div class="header-inner">
    <a class="header-logo" href="/">
      <img class="header-logo-img" src="/static/img/favicon.png" alt="妖精论坛">
      <span class="header-logo-text">妖精论坛</span>
    </a>
    <div class="header-search">
      <input id="searchInput" placeholder="搜索帖子、用户..." maxlength="50">
      <button id="searchBtn" aria-label="搜索"><i class="fa fa-search"></i></button>
    </div>
    <!-- 顶部模式导航：与头部栏合并（仅 nav-mode-top 时显示，默认隐藏） -->
    <nav class="header-nav" id="headerNav">
      <a class="nav-link" href="/forum"><i class="fa fa-list"></i><span>论坛</span></a>
      <a class="nav-link" href="/WIKI" target="_blank" rel="noopener"><i class="fa fa-book"></i><span>WIKI</span></a>
      <button class="nav-link nav-btn" data-egg title="彩蛋"><i class="fa fa-gift"></i><span>彩蛋</span></button>
      <button class="nav-link nav-btn" data-bug-report title="反馈 Bug"><i class="fa fa-bug"></i><span>反馈</span></button>
      <button class="nav-link nav-btn" data-pwa-install title="安装客户端"><i class="fa fa-download"></i><span>安装</span></button>
      <div class="nav-user" id="headerNavUser">
        <a href="/auth" class="nav-login">登录</a>
      </div>
      <button class="nav-link nav-btn" data-settings title="设置"><i class="fa fa-cog"></i><span>设置</span></button>
    </nav>
  </div>
</header>

<!-- 左侧边栏导航：除 logo/标题/搜索框外的入口都在这里，默认仅图标，可展开/收起 -->
<nav class="side-nav" id="sideNav">
  <button class="side-nav-item" id="sideNavToggle" title="展开/收起侧边栏"><i class="fa fa-angle-right"></i><span>收起</span></button>
  <a class="side-nav-item" href="/forum" title="论坛"><i class="fa fa-list"></i><span>论坛</span></a>
  <a class="side-nav-item" href="/WIKI" target="_blank" rel="noopener" title="WIKI"><i class="fa fa-book"></i><span>WIKI</span></a>
  <button class="side-nav-item" id="eggBtn" title="彩蛋"><i class="fa fa-gift"></i><span>彩蛋</span></button>
  <button class="side-nav-item" data-bug-report title="反馈 Bug"><i class="fa fa-bug"></i><span>反馈 Bug</span></button>
  <button class="side-nav-item" data-pwa-install title="安装客户端"><i class="fa fa-download"></i><span>安装客户端</span></button>
  <div class="side-nav-spacer"></div>
  <div class="side-nav-user" id="navUser">
    <a href="/auth" class="nav-login">登录</a>
  </div>
  <button class="side-nav-item" id="settingBtn" title="设置"><i class="fa fa-cog"></i><span>设置</span></button>
</nav>
<!-- 设置下拉：独立于 .side-nav（其 overflow:hidden 会裁剪右侧弹出），fixed 跟随侧边栏宽度 -->
<div class="side-setting-dropdown" id="settingDropdown">
  <div class="setting-group-title">主题</div>
  <button class="setting-item" data-theme="day"><i class="fa fa-sun-o"></i> 亮色</button>
  <button class="setting-item" data-theme="night"><i class="fa fa-moon-o"></i> 暗色</button>
  <button class="setting-item" data-theme="default"><i class="fa fa-desktop"></i> 默认</button>
  <div class="setting-divider"></div>
  <div class="setting-group-title">导航位置</div>
  <button class="setting-item" data-navmode="side"><i class="fa fa-columns"></i> 侧边</button>
  <button class="setting-item" data-navmode="top"><i class="fa fa-bars"></i> 顶部</button>
  <div class="setting-divider"></div>
  <button class="setting-item" id="logoutItem" style="display:none;"><i class="fa fa-sign-out"></i> 退出登录</button>
</div>

<div class="layout">
  <main class="layout-main">{% block content %}{% endblock %}</main>
  {% if show_world|default(true) %}
  <aside class="world-panel" id="worldPanel">
    <div class="world-resizer" id="worldResizer" title="拖拽调整宽度"></div>
    <div class="world-header">
      <span class="world-title"><i class="fa fa-globe"></i> 世界频道</span>
      <span class="world-status" id="worldStatus">连接中…</span>
      <button class="world-collapse" id="worldCollapseBtn" title="收起"><i class="fa fa-angle-right"></i></button>
    </div>
    <div class="world-messages" id="worldMessages"></div>
    <div class="world-input">
      <input id="worldInput" maxlength="500" placeholder="输入消息...（Enter 发送）">
      <button id="worldSendBtn" title="发送"><i class="fa fa-paper-plane"></i></button>
    </div>
  </aside>
  {% endif %}
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-links">
      <a href="/privacy">隐私</a>
      <a href="javascript:void(0)" id="bugReportBtn" data-bug-report>反馈 Bug</a>
      <a href="https://github.com/crazying-dev" target="_blank" rel="noopener">Github</a>
      <a href="https://crazying-dev.top" target="_blank" rel="noopener">crazying-dev.top</a>
    </div>
    <div class="footer-meta">
      邮箱：3890320020@qq.com · 本二创无官方授权，仅粉丝公益创作
    </div>
  </div>
</footer>

{% if show_global_live2d is not defined or show_global_live2d %}
<div id="global-live2d" class="global-live2d">
  <canvas id="global-live2d-canvas"></canvas>
</div>
{% endif %}

<div class="toast" id="toast"></div>

<!-- 自定义右键菜单（N2） -->
<div class="ctx-menu" id="ctxMenu"></div>

<!-- 自定义举报弹窗（N4：不再使用浏览器原生 prompt） -->
<div class="modal-mask" id="reportModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3><i class="fa fa-flag-o"></i> 举报</h3>
      <button class="modal-close" id="reportClose">&times;</button>
    </div>
    <input type="hidden" id="reportTargetType" value="post">
    <input type="hidden" id="reportTargetId" value="">
    <div class="form-group">
      <label>举报原因</label>
      <select id="reportReason">
        <option value="">请选择原因</option>
        <option value="违规内容">违规内容</option>
        <option value="广告垃圾">广告垃圾</option>
        <option value="人身攻击">人身攻击</option>
        <option value="侵权">侵权</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>补充说明（可选）</label>
      <textarea id="reportDetail" rows="3" maxlength="500" placeholder="补充说明（最多500字）"></textarea>
    </div>
    <p class="auth-error" id="reportError"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="reportCancel">取消</button>
      <button class="btn btn-primary" id="reportSubmit">提交举报</button>
    </div>
  </div>
</div>

<!-- Bug 反馈弹窗 -->
<div class="modal-mask" id="bugModal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3><i class="fa fa-bug"></i> 反馈 Bug</h3>
      <button class="modal-close" id="bugClose">&times;</button>
    </div>
    <div class="form-group">
      <label>标题</label>
      <input id="bugTitle" type="text" maxlength="200" placeholder="一句话描述问题">
    </div>
    <div class="form-group">
      <label>详细描述</label>
      <textarea id="bugDetail" rows="4" maxlength="5000" placeholder="发生了什么？期望行为是什么？"></textarea>
    </div>
    <div class="form-group">
      <label>复现步骤（可选）</label>
      <textarea id="bugSteps" rows="3" maxlength="3000" placeholder="1. ... 2. ..."></textarea>
    </div>
    <div class="form-group">
      <label>联系方式（可选）</label>
      <input id="bugContact" type="text" maxlength="200" placeholder="邮箱 / QQ，便于回复">
    </div>
    <p class="auth-error" id="bugError"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="bugCancel">取消</button>
      <button class="btn btn-primary" id="bugSubmit">提交反馈</button>
    </div>
  </div>
</div>

<script src="/static/js/AfterBody.js?v={{ static_version }}"></script>
<script>
// PWA：注册 Service Worker（仅 https 或 localhost）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/static/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
