{% extends "base.html" %}
{% block title %}世界频道 - 妖精论坛{% endblock %}
{% block body_attrs %} data-world-page{% endblock %}
{% block content %}
<div class="world-page-container">
  <div class="world-page-header">
    <h3><i class="fa fa-globe"></i> 世界频道</h3>
    <span class="world-page-status" id="worldPageStatus">连接中…</span>
  </div>
  <div class="world-page-messages" id="worldPageMessages">
    <div class="world-page-empty">加载中...</div>
  </div>
  <div class="world-page-input-bar">
    <input type="text" id="worldPageInput" placeholder="输入消息...（Enter 发送）" maxlength="500">
    <button id="worldPageSend"><i class="fa fa-paper-plane"></i> 发送</button>
  </div>
</div>

<script>
(function () {
  var messages = [];
  var myUserId = null;
  var statusEl = document.getElementById('worldPageStatus');
  var dom = document.getElementById('worldPageMessages');
  var input = document.getElementById('worldPageInput');
  var sendBtn = document.getElementById('worldPageSend');
  var pollTimer = null;
  var retry = 0;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtTime(t) {
    if (!t) return '';
    var d = new Date(String(t).replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return String(t);
    var now = new Date();
    var diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function avatarHtml(url) {
    if (!url) return '<span class="world-page-avatar"><i class="fa fa-user"></i></span>';
    return '<span class="world-page-avatar"><img src="' + esc(url) + '" alt="" loading="lazy"></span>';
  }
  function render() {
    if (!messages.length) { dom.innerHTML = '<div class="world-page-empty">暂无消息，快来抢沙发~</div>'; return; }
    var html = '';
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      var mine = myUserId && m.sender_id === myUserId;
      html +=
        '<div class="world-page-msg' + (mine ? ' mine' : '') + '">' +
        avatarHtml(m.sender_avatar) +
        '<div class="world-page-msg-body">' +
        '<div class="world-page-msg-name">' + esc(m.sender_name) + '</div>' +
        '<div class="world-page-msg-content">' + esc(m.content) + '</div>' +
        '<div class="world-page-msg-time">' + fmtTime(m.created_at) + '</div>' +
        '</div></div>';
    }
    dom.innerHTML = html;
    dom.scrollTop = dom.scrollHeight;
  }
  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'world-page-status' + (cls ? ' ' + cls : '');
  }
  function poll() {
    if (document.hidden) { pollTimer = null; return; }
    fetch('/api/world/ALL', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (Array.isArray(data)) {
          messages = data.slice(0, 200);
          render();
          setStatus('在线', 'online');
          retry = 0;
          pollTimer = setTimeout(poll, 3000);
        } else { setStatus('加载失败', 'offline'); scheduleRetry(); }
      })
      .catch(function () { setStatus('连接失败', 'offline'); scheduleRetry(); });
  }
  function scheduleRetry() {
    if (document.hidden) { pollTimer = null; return; }
    var delay = Math.min(30000, 3000 * Math.pow(2, Math.min(retry, 4)));
    retry++;
    pollTimer = setTimeout(poll, delay);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { if (pollTimer) clearTimeout(pollTimer); poll(); }
    else if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  });
  function send() {
    var content = input.value.trim();
    if (!content) return;
    fetch('/api/world/Send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ content: content })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success) { input.value = ''; poll(); }
        else if (d && d.message) { setStatus(d.message, 'offline'); }
        else if (d && !d.success && !d.message) { window.location.href = '/auth'; }
      })
      .catch(function () { setStatus('发送失败', 'offline'); });
  }
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  // 当前用户 id（用于标记自己的消息）
  fetch('/api/user/info', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.success && d.user) myUserId = d.user.id; })
    .catch(function () {});
  poll();
})();
</script>

<style>
.world-page-container {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 120px);
  min-height: 420px;
  background: var(--color-bg-card);
  border-radius: 12px;
  overflow: hidden;
}
.world-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--color-bg-item-hover);
  border-bottom: 1px solid var(--color-border-divider);
}
.world-page-header h3 { margin: 0; font-size: 16px; color: var(--color-text-primary); }
.world-page-status { font-size: 12px; color: var(--color-text-tertiary); }
.world-page-status.online { color: #10b981; }
.world-page-status.offline { color: #ef4444; }
.world-page-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.world-page-empty { color: var(--color-text-tertiary); text-align: center; margin-top: 40px; font-size: 13px; }
.world-page-msg { display: flex; gap: 10px; }
.world-page-msg.mine { flex-direction: row-reverse; }
.world-page-avatar { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--color-bg-icon); display: flex; align-items: center; justify-content: center; color: var(--color-text-tertiary); }
.world-page-avatar img { width: 100%; height: 100%; object-fit: cover; }
.world-page-msg-body { max-width: 70%; }
.world-page-msg.mine .world-page-msg-body { text-align: right; }
.world-page-msg-name { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 2px; }
.world-page-msg-content { font-size: 14px; color: var(--color-text-primary); background: var(--color-bg-item-hover); padding: 8px 12px; border-radius: 10px; word-break: break-word; }
.world-page-msg-time { font-size: 11px; color: var(--color-text-tertiary); margin-top: 3px; }
.world-page-input-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--color-border-divider); }
.world-page-input-bar input { flex: 1; padding: 8px 12px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-bg-secondary); color: var(--color-text-primary); }
.world-page-input-bar button { padding: 8px 18px; border: none; border-radius: 8px; background: var(--color-primary); color: #fff; cursor: pointer; }
</style>
{% endblock %}
