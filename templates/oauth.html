{% extends "base.html" %}
{% block title %}第三方授权登录 - 妖精论坛{% endblock %}
{% block body_attrs %} data-vue-page="oauth"{% endblock %}
{% block content %}
<div class="oauth-container">
  <div class="oauth-card">
    <h1>第三方授权登录</h1>
    <p>第三方应用请求访问您的论坛账号信息，请确认是否授权。</p>
    <div class="oauth-user-info"><div class="oauth-user-name" id="oauth-username">加载中...</div></div>
    <div class="oauth-actions">
      <button class="oauth-btn oauth-btn-confirm" id="oauth-confirm" disabled>授权并继续</button>
      <button class="oauth-btn oauth-btn-cancel" onclick="window.close()">拒绝</button>
    </div>
    <div class="oauth-status" id="oauth-status"></div>
  </div>
</div>

<script>
(function() {
  var port = {{ port | tojson | safe }};
  var userInfo = null;
  var statusEl = document.getElementById('oauth-status');
  var nameEl = document.getElementById('oauth-username');
  var confirmBtn = document.getElementById('oauth-confirm');
  function setStatus(text, ok) {
    statusEl.textContent = text || '';
    statusEl.className = 'oauth-status' + (ok ? ' oauth-status-ok' : ' oauth-status-err');
  }
  fetch('/api/user/info', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (data) {
    if (data && data.success && data.user) {
      userInfo = data.user;
      nameEl.textContent = userInfo.name;
      confirmBtn.disabled = false;
    } else {
      nameEl.textContent = '未登录';
      setStatus('请先在妖精论坛登录后重试', false);
    }
  }).catch(function () {
    nameEl.textContent = '网络错误';
    setStatus('网络错误，请稍后重试', false);
  });
  confirmBtn.addEventListener('click', function () {
    if (!userInfo) return;
    var userData = JSON.stringify({
      id: userInfo.id,
      name: userInfo.name,
      avatar: userInfo.avatar
    });
    var url = 'http://localhost:' + port + '/callback?user=' + encodeURIComponent(userData);
    window.location.href = url;
  });
})();
</script>

<style>
.oauth-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  padding: 20px;
}
.oauth-card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border-divider);
  border-radius: 12px;
  padding: 32px;
  width: 400px;
  max-width: 90vw;
  text-align: center;
}
.oauth-card h1 { font-size: 20px; margin-bottom: 16px; color: var(--color-text-primary); }
.oauth-card p { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 24px; line-height: 1.6; }
.oauth-user-info { background: var(--color-bg-item-hover); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
.oauth-user-name { font-size: 18px; font-weight: bold; color: var(--color-primary); }
.oauth-actions { display: flex; gap: 12px; justify-content: center; }
.oauth-btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.oauth-btn-confirm { background: #238636; color: #fff; }
.oauth-btn-confirm:disabled { opacity: .5; cursor: not-allowed; }
.oauth-btn-cancel { background: var(--color-bg-icon); color: var(--color-text-secondary); }
.oauth-status { margin-top: 16px; font-size: 13px; min-height: 20px; }
.oauth-status-ok { color: #3fb950; }
.oauth-status-err { color: #ef4444; }
</style>
{% endblock %}
