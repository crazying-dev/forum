<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third-party Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;width:400px;max-width:90vw;text-align:center}
.card h1{font-size:20px;margin-bottom:16px;color:#f0f6fc}
.card p{font-size:14px;color:#8b949e;margin-bottom:24px;line-height:1.6}
.user-info{background:#0d1117;border-radius:8px;padding:16px;margin-bottom:24px}
.user-name{font-size:18px;font-weight:bold;color:#58a6ff}
.actions{display:flex;gap:12px;justify-content:center}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.btn-confirm{background:#238636;color:white}
.btn-cancel{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.status{margin-top:16px;font-size:13px;min-height:20px}
.status-ok{color:#3fb950}
.status-err{color:#f85149}
</style>
</head>
<body>
<div class="card">
<h1>Third-party Login</h1>
<p>An application wants to access your forum account info. Please confirm to proceed.</p>
<div class="user-info"><div class="user-name" id="username">Loading...</div></div>
<div class="actions">
<button class="btn btn-confirm" id="confirmBtn" disabled onclick="doAuth()">Authorize</button>
<button class="btn btn-cancel" onclick="window.close()">Deny</button>
</div>
<div class="status" id="status"></div>
</div>
<script>
var port = '{{ port }}';
var userInfo = null;
function $(id){return document.getElementById(id)}
fetch('/api/user/info').then(function(r){return r.json()}).then(function(data){
if(data.success){userInfo=data.user;$('username').textContent=userInfo.name;$('confirmBtn').disabled=false}
else{$('username').textContent='Not logged in';$('status').textContent='Please login to the forum first';$('status').className='status status-err'}
}).catch(function(){$('username').textContent='Network error'});
function doAuth(){
if(!userInfo)return;
var userData=JSON.stringify({id:userInfo.id,name:userInfo.name,avatar:userInfo.avatar});
var url='http://localhost:'+port+'/callback?user='+encodeURIComponent(userData);
window.location.href=url;
}
</script>
</body>
</html>
