    <script>
    // 防闪屏：优先读 localStorage，否则按时间判断
    (function() {
        var theme = localStorage.getItem('forum-theme');
        if (theme === 'day') {
            // 亮色模式
        } else if (theme === 'night') {
            document.documentElement.classList.add('night-mode');
        } else {
            // 默认或无记录：时间判断（6:00-18:00 亮色，其余暗色）
            var h = new Date().getHours();
            if (h < 6 || h >= 18) {
                document.documentElement.classList.add('night-mode');
            }
        }
    })();
    </script>

<script>
function showDonateCard() {
    var modal = document.getElementById('donate-modal');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeDonateCard() {
    var modal = document.getElementById('donate-modal');
    modal.style.display = 'none';
    document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var modal = document.getElementById('donate-modal');
        if (modal && modal.style.display === 'flex') {
            closeDonateCard();
        }
    }
});
</script>

<script src="//assets.crazying-dev.top/text/one/JS/AfterBody.js" defer></script>
<script>
// 主题持久化：监听主题按钮点击保存到 localStorage，并在 AfterBody.js 加载后重新应用
(function() {
    var THEME_KEY = 'forum-theme';
    function saveTheme(value) {
        try { localStorage.setItem(THEME_KEY, value); } catch(e) {}
    }
    // 桌面端设置菜单中的主题选项
    document.addEventListener('click', function(e) {
        var item = e.target.closest('.setting-dropdown-item');
        if (item) {
            var value = item.getAttribute('data-value');
            if (value) saveTheme(value);
        }
    });
    // 移动端菜单中的主题按钮
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.mobile-theme-btn');
        if (btn) {
            var value = btn.getAttribute('data-value');
            if (value) saveTheme(value);
        }
    });

    // AfterBody.js（defer）会在 DOMContentLoaded 前执行，并用时间覆盖主题。
    // 这里在 DOMContentLoaded 后按 localStorage 重新修正，防止被覆盖。
    function applyStoredTheme() {
        var theme = localStorage.getItem(THEME_KEY);
        if (!window.Theme) return;  // AfterBody.js 尚未加载
        if (theme === 'day') {
            window.Theme.setTimeControl(false);
            window.Theme.setTheme('day');
        } else if (theme === 'night') {
            window.Theme.setTimeControl(false);
            window.Theme.setTheme('night');
        }
        // 'default' 或无记录：不干预，保持 AfterBody.js 的时间控制

        // 同步桌面端下拉菜单的选中态（updateActiveState 是内部函数，手动更新）
        var items = document.querySelectorAll('.setting-dropdown-item');
        items.forEach(function(item) { item.classList.remove('active'); });
        var activeValue = theme || 'default';
        var activeItem = document.querySelector('.setting-dropdown-item[data-value="' + activeValue + '"]');
        if (activeItem) activeItem.classList.add('active');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            // setTimeout(0) 确保 AfterBody.js 的同步初始化代码已全部跑完
            setTimeout(applyStoredTheme, 0);
        });
    } else {
        applyStoredTheme();
    }

    // 登录状态检测：未登录时隐藏退出按钮
    // AfterBody.js 的 loadUserInfo() 会异步更新 #UserInfo 的 href
    function toggleLogoutButton() {
        var userInfo = document.getElementById('UserInfo');
        var logoutBtn = document.getElementById('logoutBtn');
        var mobileLogout = document.querySelector('.mobile-menu-item[onclick*="handleLogout"]');
        var href = userInfo ? userInfo.getAttribute('href') : '';
        // href 为 /users/xxx 说明已登录，其余情况（#、/login）均隐藏退出按钮
        var isLoggedIn = href && href.startsWith('/users/');
        if (logoutBtn) logoutBtn.style.display = isLoggedIn ? '' : 'none';
        if (mobileLogout) mobileLogout.style.display = isLoggedIn ? '' : 'none';
    }

    var userInfoEl = document.getElementById('UserInfo');
    if (userInfoEl) {
        // 监听 href 属性变化（loadUserInfo 完成后会改为 /login 或 /users/xxx）
        var logoutObserver = new MutationObserver(toggleLogoutButton);
        logoutObserver.observe(userInfoEl, { attributes: true, attributeFilter: ['href'] });
        // 初始状态也检查一次
        toggleLogoutButton();
    }
})();
</script>

<script>
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    var li = document.getElementById('pwa-install-li');
    if (li) li.style.display = '';
});
window.installPWA = function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
        var li = document.getElementById('pwa-install-li');
        if (li) li.style.display = 'none';
        if (result.outcome === 'accepted') console.log('PWA installed');
    });
};
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(r) {
            console.log('SW registered');
        }).catch(function(err) {
            console.log('SW failed:', err);
        });
    });
}
</script>
