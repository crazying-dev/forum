name: Android Release

on:
  push:
    tags:
      - 'Android-V*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CERT_SHA256: bab9ac497b3b5b4f8fe3e36fbb9fec111c08831dc6e9100889a439f019aa4668

jobs:
  build:
    name: Build & verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tag is on the Android branch
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/Android:refs/remotes/origin/Android"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/Android; then
            echo "::error::tag $GITHUB_REF_NAME 指向的提交不在 Android 分支上，拒绝发布"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 仅按空格拆分该输入，必须写成单行
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#Android-V}"
            IS_TAG=true
          else
            VERSION="$(sed -nE 's/^[[:space:]]*val appVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
            IS_TAG=false
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::无法解析版本号"
            exit 1
          fi
          # 只接受 major.minor.patch：预发布后缀不参与发布（避免 beta/stable 版本语义歧义）
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 major.minor.patch（不带 -beta / -rc 后缀）：${VERSION}"
            exit 1
          fi
          {
            echo "APP_VERSION=${VERSION}"
            echo "IS_TAG=${IS_TAG}"
          } >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本：${VERSION}（IS_TAG=${IS_TAG}）"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secrets.ANDROID_KEYSTORE_BASE64，无法签名 release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::keystore 还原失败"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少签名变量 ${name}"
              exit 1
            fi
          done
          chmod +x gradlew
          if [ "${IS_TAG}" = "true" ]; then
            ./gradlew --stacktrace assembleRelease -PexpectedVersion="$APP_VERSION"
          else
            ./gradlew --stacktrace assembleRelease
          fi

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到已签名的 release APK：$APK"
            exit 1
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner：$APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apksigner-certs.txt"
          CERT_LINE="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner-certs.txt" || true)"
          ACTUAL_SHA256="$(printf '%s' "$CERT_LINE" | sed -E 's/^[^:]*:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$ACTUAL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::无法从 apksigner 输出解析证书 SHA-256"
            exit 1
          fi
          if [ "$ACTUAL_SHA256" != "$CERT_SHA256" ]; then
            echo "::error::签名证书 SHA-256 不匹配：期望 $CERT_SHA256，实际 $ACTUAL_SHA256"
            exit 1
          fi
          echo "签名证书 SHA-256 校验通过：$ACTUAL_SHA256"

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::找不到 release APK：$APK"
            exit 1
          fi
          OUT="forum-android-${APP_VERSION}.apk"
          cp "$APK" "$OUT"
          SIZE_BYTES="$(stat -c '%s' "$OUT")"
          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          {
            echo "SIZE_BYTES=${SIZE_BYTES}"
            echo "SHA256=${SHA256}"
          } >> "$GITHUB_ENV"
          echo "已生成 ${OUT}（${SIZE_BYTES} 字节，SHA-256 ${SHA256}）"

      - name: Generate release notes
        run: |
          set -euo pipefail
          APK_NAME="forum-android-${APP_VERSION}.apk"
          # 上一个 Android-V* tag（按版本排序排除当前 tag；手动触发时取最新 tag）
          PREV_TAG="$(git tag -l 'Android-V*' --sort=-v:refname | grep -F -x -v "${GITHUB_REF_NAME}" | head -n 1 || true)"
          {
            echo "## Android V${APP_VERSION}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "变更（\`${PREV_TAG}\`..HEAD）："
              echo
              git log --no-merges --pretty='- %s' "${PREV_TAG}..HEAD"
            else
              echo "变更（最近 20 条提交）："
              echo
              git log --no-merges --pretty='- %s' -20
            fi
            echo
            echo "### 安装包"
            echo
            echo "| 文件名 | 大小（字节） | SHA-256 | 签名证书 SHA-256 | 最低 SDK | 目标 SDK |"
            echo "| --- | ---: | --- | --- | ---: | ---: |"
            echo "| ${APK_NAME} | ${SIZE_BYTES} | ${SHA256} | ${CERT_SHA256} | 24 | 36 |"
          } > release-notes.md
          cat release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: |
            forum-android-${{ steps.version.outputs.version }}.apk
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Android V${{ needs.build.outputs.version }}
          body_path: dist/release-notes.md
          files: dist/forum-android-${{ needs.build.outputs.version }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
